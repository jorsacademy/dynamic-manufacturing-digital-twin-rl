name: Ruff Import Probe

on:
  pull_request:
    paths:
      - ".github/workflows/ruff-import-probe.yml"

permissions:
  contents: read

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Ruff family
        run: python -m pip install "ruff>=0.6,<1"
      - name: Show canonical import diff
        run: |
          ruff check --select I --fix src/dmdtrl/fjsp_ppo_campaign.py src/dmdtrl/fjsp_ppo_member.py
          git diff -- src/dmdtrl/fjsp_ppo_campaign.py src/dmdtrl/fjsp_ppo_member.py
