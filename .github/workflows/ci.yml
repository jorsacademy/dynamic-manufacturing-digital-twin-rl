name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=dmdtrl --cov-report=term-missing --cov-fail-under=85

      - name: Research harness smoke test
        if: matrix.python-version == '3.11'
        run: >-
          dmdtrl-research
          --seeds 2
          --bootstrap 100
          --permutations 100
          --raw-output /tmp/research_runs.csv
          --summary-output /tmp/research_summary.csv
